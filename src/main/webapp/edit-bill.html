<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Bill - Dental Clinic</title>

    <link rel="stylesheet" href="css/billing.css">
    <link rel="stylesheet" href="css/edit-bill.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <link rel="stylesheet" href="css/common-sidebar.css">
    <link rel="stylesheet" href="css/clinic-background.css">
</head>

<body>

<div class="billing-page">

<div class="sidebar">

    <h2>🦷 Dental Clinic</h2>

    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="patients.html">👤 Patients</a>
    <a href="LoadPatientsServlet">📅 Appointments</a>
    <a href="dentists.html">🦷 Dentists</a>
    <a href="BillingServlet" class="active">💳 Billing</a>
    <a href="report.html">📊 Reports</a>
    <a href="#">👥 User Management</a>
    <a href="index.html">🚪 Logout</a>

</div>


    <main class="billing-content">

        <div class="billing-header">

            <div>
                <h1>Edit Bill</h1>
                <p>Update patient billing information</p>
            </div>

            <a href="billing.html"
               class="create-bill-btn">
                ← Back to Billing
            </a>

        </div>


        <div class="edit-bill-card">

            <div id="loadingMessage">
                Loading bill...
            </div>


            <form id="editBillForm"
                  style="display:none;">

                <input type="hidden"
                       id="billId"
                       name="billId">


                <div class="readonly-field">

                    <label>Appointment ID</label>

                    <input type="text"
                           id="appointmentId"
                           readonly>

                </div>


                <div class="readonly-field">

                    <label>Patient</label>

                    <input type="text"
                           id="patientName"
                           readonly>

                </div>


                <div class="readonly-field">

                    <label>Dentist</label>

                    <input type="text"
                           id="dentistName"
                           readonly>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="treatmentCharge">
                            Treatment Charge
                        </label>

                        <input type="number"
                               id="treatmentCharge"
                               name="treatmentCharge"
                               min="0"
                               step="0.01"
                               required>

                    </div>


                    <div class="form-group">

                        <label for="discount">
                            Discount
                        </label>

                        <input type="number"
                               id="discount"
                               name="discount"
                               min="0"
                               step="0.01"
                               value="0"
                               required>

                    </div>

                </div>


                <div class="form-group">

                    <label for="amountPaid">
                        Amount Paid
                    </label>

                    <input type="number"
                           id="amountPaid"
                           name="amountPaid"
                           min="0"
                           step="0.01"
                           required>

                </div>


                <!-- Summary -->

                <div class="bill-summary">

                    <div class="bill-summary-row">

                        <span>Treatment Charge</span>

                        <strong id="summaryCharge">
                            Rs. 0.00
                        </strong>

                    </div>


                    <div class="bill-summary-row">

                        <span>Discount</span>

                        <strong id="summaryDiscount">
                            Rs. 0.00
                        </strong>

                    </div>


                    <div class="bill-summary-row total">

                        <span>Total</span>

                        <strong id="summaryTotal">
                            Rs. 0.00
                        </strong>

                    </div>


                    <div class="bill-summary-row">

                        <span>Amount Paid</span>

                        <strong id="summaryPaid">
                            Rs. 0.00
                        </strong>

                    </div>


                    <div class="bill-summary-row balance">

                        <span>Balance</span>

                        <strong id="summaryBalance">
                            Rs. 0.00
                        </strong>

                    </div>

                </div>


                <div class="form-group">

                    <label for="status">
                        Payment Status
                    </label>

                    <select id="status"
                            name="status">

                        <option value="Unpaid">
                            Unpaid
                        </option>

                        <option value="Partial">
                            Partial
                        </option>

                        <option value="Paid">
                            Paid
                        </option>

                    </select>

                </div>


                <div id="formMessage"
                     class="form-message">
                </div>


                <div class="form-buttons">

                    <button type="submit"
                            class="btn-primary">
                        Update Bill
                    </button>

                    <a href="billing.html"
                       class="btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>

</div>


<script src="js/edit-bill.js"></script>

    <script src="js/sidebar.js"></script>
    <script src="js/role.js"></script>
</body>
</html>
