<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Bill - Dental Clinic</title>
    <link rel="stylesheet" href="css/billing.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/common-sidebar.css">
    <link rel="stylesheet" href="css/clinic-background.css">
</head>
<body>

    <div class="sidebar">

        <h2>🦷 Dental Clinic</h2>

        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="patients.html">👤 Patients</a>
        <a href="LoadPatientsServlet">📅 Appointments</a>
        <a href="dentists.html">🦷 Dentists</a>
        <a href="BillingServlet" class="active">💳 Billing</a>
        <a href="report.html">📊 Reports</a>
        <a href="#">👥 User Management</a>
        <a href="index.html">🚪 Logout</a>

    </div>

<main class="main">
    <header class="topbar">
        <div>
            <h1>Create Bill</h1>
            <p>Create a new patient bill</p>
        </div>
        <a class="back-btn" href="billing.html">← Back to Billing</a>
    </header>

    <section class="form-card">
        <h2>Bill Details</h2>
        <div id="errorMessage" class="message error hidden"></div>

        <form action="CreateBillServlet" method="post" id="createBillForm">
            <div class="form-group">
                <label for="appointmentId">Appointment ID</label>
                <input type="number" id="appointmentId" name="appointmentId"
                       min="1" required placeholder="Enter appointment ID">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="treatmentCharge">Treatment Charge</label>
                    <input type="number" id="treatmentCharge" name="treatmentCharge"
                           min="0" step="0.01" value="0" required>
                </div>
                <div class="form-group">
                    <label for="discount">Discount</label>
                    <input type="number" id="discount" name="discount"
                           min="0" step="0.01" value="0" required>
                </div>
            </div>

            <div class="form-group">
                <label for="amountPaid">Amount Paid</label>
                <input type="number" id="amountPaid" name="amountPaid"
                       min="0" step="0.01" value="0" required>
            </div>

            <div class="total-box">
                <div class="total-row"><span>Treatment Charge</span><strong id="displayCharge">Rs. 0.00</strong></div>
                <div class="total-row"><span>Discount</span><strong id="displayDiscount">Rs. 0.00</strong></div>
                <div class="total-row final"><span>Total</span><strong id="displayTotal">Rs. 0.00</strong></div>
                <div class="total-row"><span>Amount Paid</span><strong id="displayPaid">Rs. 0.00</strong></div>
                <div class="total-row"><span>Balance</span><strong id="displayBalance">Rs. 0.00</strong></div>
            </div>

            <div class="buttons">
                <button type="submit" class="btn btn-primary">Create Bill</button>
                <a href="billing.html" class="btn btn-cancel">Cancel</a>
            </div>
        </form>
    </section>
</main>

<script src="js/billing.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/role.js"></script>
</body>
</html>
