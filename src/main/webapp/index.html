<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/clinic-background.css">
</head>
<body>

<div class="login-box">
    <h1>Sunrise Dental Clinic</h1>
    <h3>Online Reservation System</h3>

    <form action="/DentalClinicReservationSystem/LoginServlet" method="post">

    <input
        type="text"
        id="username"
        name="username"
        placeholder="Username"
        required>

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        required>

    <button type="submit">Login</button>

</form>

    <p id="message"></p>
</div>

    <script src="js/role.js"></script>
</body>
</html>
