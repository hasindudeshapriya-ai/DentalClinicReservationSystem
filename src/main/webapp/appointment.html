<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Management</title>

    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/appointment.css">
    <link rel="stylesheet" href="css/common-sidebar.css">
    <link rel="stylesheet" href="css/clinic-background.css">
</head>

<body>

<div class="sidebar">

    <h2>🦷 Dental Clinic</h2>

    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="patients.html">👤 Patients</a>
    <a href="LoadPatientsServlet" class="active">📅 Appointments</a>
    <a href="dentists.html">🦷 Dentists</a>
    <a href="BillingServlet">💳 Billing</a>
    <a href="report.html">📊 Reports</a>
    <a href="#">👥 User Management</a>
    <a href="index.html">🚪 Logout</a>

</div>

<div class="main">

    <div class="topbar">
        <h1>Appointment Management</h1>
        <h3>Book New Appointment</h3>
    </div>
    
      <div class="top-buttons">
    <a href="ViewAppointmentsServlet" class="view-btn">📋 View All Appointments</a>
</div>

    <div class="form-container">

        <form action="AppointmentServlet" method="post">

            <div class="row">

                <div class="input-group">
                    <label>Patient</label>

                    <select name="patientId" required>
                        <option value="">-- Select Patient --</option>
                    </select>

                </div>

                <div class="input-group">
                    <label>Dentist</label>

                    <select name="dentistId" required>
    <option value="">-- Select Dentist --</option>
</select>

                </div>

            </div>

            <div class="row">

                <div class="input-group">
                    <label>Appointment Date</label>
                    <input type="date" name="appointmentDate" required>
                </div>

                <div class="input-group">
                    <label>Appointment Time</label>
                    <input type="time" name="appointmentTime" required>
                </div>

            </div>

            <div class="input-group">
                <label>Treatment</label>
                <input type="text"
                       name="treatment"
                       placeholder="Enter treatment"
                       required>
            </div>

            <div class="input-group">
                <label>Status</label>

                <select name="status">

                    <option value="Scheduled">Scheduled</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>

                </select>

            </div>

            <div class="button-group">

                <button type="submit" class="save-btn">
                    Book Appointment
                </button>

                <button type="reset" class="clear-btn">
                    Clear
                </button>

            </div>

        </form>

    </div>

</div>

    <script src="js/sidebar.js"></script>
    <script src="js/role.js"></script>
    <script src="js/appointment.js"></script>
</body>
</html>
